name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / Commander ${{ matrix.commander }} / Bash ${{ matrix.bash }} / Fish ${{ matrix.fish }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '22.12.0'
            commander: '14'
            bash: '5'
            fish: '4.0.0'
          - os: ubuntu-24.04
            node: '24'
            commander: '15'
            bash: '5'
            fish: latest
          - os: macos-14
            node: '22.12.0'
            commander: '15'
            bash: '3.2'
            fish: latest
          - os: macos-14
            node: node
            commander: '14'
            bash: '5'
            fish: latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install Linux shell dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh cmake ninja-build libncurses-dev libpcre2-dev gettext
          echo 'TEST_BASH=/bin/bash' >> "$GITHUB_ENV"
          echo 'TEST_ZSH=/usr/bin/zsh' >> "$GITHUB_ENV"

      - name: Build the minimum Fish version
        if: matrix.fish == '4.0.0'
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
          rustc --version
          curl --fail --location --retry 3 \
            https://github.com/fish-shell/fish-shell/releases/download/4.0.0/fish-4.0.0.tar.xz \
            --output "$RUNNER_TEMP/fish.tar.xz"
          echo "2fda5bd970357064d8d4c896e08285ba59965ca2a8c4829ca8a82bf3b89c69f3  $RUNNER_TEMP/fish.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/fish.tar.xz" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/fish-4.0.0" -B "$RUNNER_TEMP/fish-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/fish" \
            -DBUILD_TESTING=OFF -DBUILD_DOCS=OFF
          cmake --build "$RUNNER_TEMP/fish-build" --parallel 2
          cmake --install "$RUNNER_TEMP/fish-build"
          echo "TEST_FISH=$RUNNER_TEMP/fish/bin/fish" >> "$GITHUB_ENV"

      - name: Install current Fish on Linux
        if: runner.os == 'Linux' && matrix.fish == 'latest'
        run: |
          sudo add-apt-repository -y ppa:fish-shell/release-4
          sudo apt-get update
          sudo apt-get install -y fish
          echo 'TEST_FISH=/usr/bin/fish' >> "$GITHUB_ENV"

      - name: Install macOS shells
        if: runner.os == 'macOS'
        env:
          BASH_MAJOR: ${{ matrix.bash }}
        run: |
          brew install fish bash
          echo "TEST_FISH=$(brew --prefix fish)/bin/fish" >> "$GITHUB_ENV"
          echo 'TEST_ZSH=/bin/zsh' >> "$GITHUB_ENV"
          if [[ "$BASH_MAJOR" == '3.2' ]]; then
            echo 'TEST_BASH=/bin/bash' >> "$GITHUB_ENV"
          else
            echo "TEST_BASH=$(brew --prefix bash)/bin/bash" >> "$GITHUB_ENV"
          fi

      - name: Verify shell versions
        env:
          EXPECTED_BASH: ${{ matrix.bash }}
          EXPECTED_FISH: ${{ matrix.fish }}
        run: |
          "$TEST_BASH" --version
          "$TEST_ZSH" --version
          "$TEST_FISH" --version
          "$TEST_BASH" --version | head -n 1 | grep -F "version $EXPECTED_BASH."
          "$TEST_ZSH" --version | grep -E 'zsh (5\.(9|[1-9][0-9])|[6-9]\.)'
          if [[ "$EXPECTED_FISH" == '4.0.0' ]]; then
            "$TEST_FISH" --version | grep -F 'version 4.0.0'
          else
            "$TEST_FISH" --version | grep -E 'version ([4-9]|[1-9][0-9]+)\.'
          fi

      - run: npm ci
      - name: Select Commander version
        env:
          COMMANDER_MAJOR: ${{ matrix.commander }}
        run: npm install --no-save --package-lock=false "commander@$COMMANDER_MAJOR"
      - run: npm run validate
